name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  functions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  emulator-smoke:
    runs-on: ubuntu-latest
    needs: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci --prefix functions && npm run build --prefix functions
      - name: Call health function in emulator
        run: >
          npx --yes firebase-tools@15.35.0 emulators:exec
          --project demo-calendar-sync --only functions,firestore,auth
          "curl -sf http://127.0.0.1:5001/demo-calendar-sync/us-central1/health | grep '\"status\":\"ok\"'"

  auth-e2e:
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci --prefix apps/web
      - name: Sign-in, connect, disconnect, sign-out against emulators + mock OAuth
        run: >
          npx --yes firebase-tools@15.35.0 emulators:exec
          --project demo-calendar-sync --only auth,firestore
          "bash apps/web/scripts/e2e.sh"
